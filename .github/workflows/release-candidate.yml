# SPDX-License-Identifier: MPL-2.0

name: Unsigned release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_WINDOWS_X64_SHA256: "D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E"

jobs:
  build-unsigned-candidate:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out origin
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne '${{ github.sha }}') {
            throw 'The checked-out revision does not match the workflow origin.'
          }
          if (git status --porcelain --untracked-files=no) {
            throw 'The checked-out tracked source is not clean.'
          }

      - name: Acquire exact Gitleaks CLI
        shell: pwsh
        run: |
          $archiveName = 'gitleaks_{0}_windows_x64.zip' -f $env:GITLEAKS_VERSION
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $toolRoot = Join-Path $env:RUNNER_TEMP "gitleaks-$env:GITLEAKS_VERSION"
          $downloadUrl = "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/$archiveName"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath -MaximumRedirection 5

          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualSha256 -cne $env:GITLEAKS_WINDOWS_X64_SHA256) {
            throw "Gitleaks archive SHA-256 verification failed."
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolRoot
          $gitleaksPath = Join-Path $toolRoot 'gitleaks.exe'
          if (-not (Test-Path -LiteralPath $gitleaksPath -PathType Leaf)) {
            throw 'The verified Gitleaks archive does not contain gitleaks.exe.'
          }

          $reportedVersion = (& $gitleaksPath version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -cne $env:GITLEAKS_VERSION) {
            throw "The verified Gitleaks executable reported an unexpected version."
          }

          "GITLEAKS_PATH=$gitleaksPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Verified Gitleaks $reportedVersion Windows x64 archive SHA-256 $actualSha256."

      - name: Scan repository history for secrets
        shell: pwsh
        run: |
          & $env:GITLEAKS_PATH git . --no-banner --redact --log-opts="--all --full-history"
          if ($LASTEXITCODE -ne 0) {
            throw 'Gitleaks found a secret or could not complete the history scan.'
          }

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.400

      - name: Verify source licensing and release hygiene
        shell: pwsh
        run: |
          ./eng/verify-license.ps1
          ./eng/verify-release-security.ps1
          git diff --check

      - name: Restore pinned project dependencies
        shell: pwsh
        run: dotnet restore RelayBridge.sln

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $audit = dotnet list RelayBridge.sln package --vulnerable --include-transitive 2>&1
          $audit | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($audit -join "`n") -match 'has the following vulnerable packages') {
            throw 'NuGet vulnerability audit failed.'
          }

      - name: Build
        shell: pwsh
        run: dotnet build RelayBridge.sln --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test RelayBridge.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Build and validate unsigned installer candidate
        shell: pwsh
        run: ./installer/build-installer.ps1 -Configuration Release

      - name: Upload unsigned candidate and compliance metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relaybridge-unsigned-candidate-${{ github.sha }}
          path: |
            artifacts/installer/package/*.msi
            artifacts/installer/package/*.exe
            artifacts/installer/package/*.cdx.json
            artifacts/installer/package/THIRD-PARTY-NOTICES.md
            artifacts/installer/package/GETTING-STARTED.md
            artifacts/installer/package/LICENSE
            artifacts/installer/package/RELEASE-NOTES-*.md
            artifacts/installer/package/RELEASE-PROVENANCE.json
            artifacts/installer/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.sha }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14
