# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.400

      - name: Verify source licensing
        shell: pwsh
        run: ./eng/verify-license.ps1

      - name: Restore
        run: dotnet restore RelayBridge.sln

      - name: Build
        run: dotnet build RelayBridge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RelayBridge.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
